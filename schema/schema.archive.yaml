definitions:
  name: 'OSI Hackathon Schema'
  sections:
    Amount:
      base_sections:
        - nomad.datamodel.data.ArchiveSection
      quantities:
        type:
          type: str
          description: "Kind of amount, such as molarity, molality, mass fraction, molar fraction, or partial pressure."
          m_annotations:
            eln:
              component: StringEditQuantity
        value:
          type: np.float64
          description: "Numerical value of the extracted amount in the specified units."
          m_annotations:
            eln:
              component: NumberEditQuantity
        units:
          type: str
          description: "Units associated with the value, such as mol/L, mol/kg, Pa, or dimensionless."
          m_annotations:
            eln:
              component: StringEditQuantity

    PhaseComponent:
      base_sections:
        - nomad.datamodel.data.ArchiveSection
      quantities:
        name:
          type: str
          description: "Short descriptive name identifying this component within the phase."
          m_annotations:
            eln:
              component: StringEditQuantity
      sub_sections:
        substance:
          section: nomad.datamodel.metainfo.basesections.PubChemPureSubstanceSection
          description: "Chemical identity and PubChem details of the substance forming this component."
        amount:
          section: Amount
          description: "Extracted amount expressed by its type, value, and units."

    Phase:
      base_sections:
        - nomad.datamodel.data.ArchiveSection
      quantities:
        name:
          type: str
          description: "Short descriptive name identifying this phase within the equilibrium solution."
          m_annotations:
            eln:
              component: StringEditQuantity
        state_of_matter:
          type:
            type_kind: Enum
            type_data:
              - solid
              - liquid
              - gas
          description: "Physical state of the phase, such as solid, liquid, or gas."
          m_annotations:
            eln:
              component: EnumEditQuantity
      sub_sections:
        amount:
          section: Amount
          description: "Extracted amount expressed by its type, value, and units."
        substance:
          section: nomad.datamodel.metainfo.basesections.PubChemPureSubstanceSection
          description: "Chemical identity and PubChem details of the substance forming this phase."
        components:
          repeats: true
          section: "#/PhaseComponent"
          description: "Components forming this phase, with their substance details and extracted amounts."

    EquilibriumSolution:
      base_sections:
        - nomad.datamodel.data.EntryData
        - nomad.datamodel.metainfo.basesections.BaseSection
      quantities:
        temperature:
          type: np.float64
          unit: kelvin
          description: "Isothermal temperature of the solution."
          m_annotations:
            eln:
              component: NumberEditQuantity
            display:
              unit: celsius
        pressure:
          type: np.float64
          unit: pascal
          description: "Gas pressure over the solution (assumed to be isobar)."
          m_annotations:
            eln:
              component: NumberEditQuantity
            display:
              unit: pascal
        measurement_methods:
          type: str
          shape: ["*"]
          description: "Methods used to measure the equilibrium properties of the solution."
          m_annotations:
            eln:
              component: StringEditQuantity
        mixing_methods:
          type: str
          shape: ["*"]
          description: "Methods used to mix the components when preparing the solution."
          m_annotations:
            eln:
              component: StringEditQuantity
      sub_sections:
        phases:
          repeats: true
          section: "#/Phase"
        publication_references:
          repeats: true
          section: nomad.datamodel.metainfo.basesections.PublicationReference
